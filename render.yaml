services:
  - type: web
    name: ues-agent
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: SKILLS_ADMIN_TOKEN
        generateValue: true
      - key: DEEPSEEK_API_BASE_URL
        value: https://api.deepseek.com
      - key: DATA_DIR
        value: /var/data
      - key: DOCKER_HOST
        sync: false
      - key: SANDBOX_IMAGE
        value: node:22-alpine
      - key: CONVERSATION_TTL_MS
        value: "86400000"
    disk:
      name: ues-agent-data
      mountPath: /var/data
      sizeGB: 1

services:
  - type: web
    name: ues-agent
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: E2B_API_KEY
        sync: false
      - key: E2B_TEMPLATE
        value: opencode
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: E2B_SANDBOX_TIMEOUT_MS
        value: "1800000"
      - key: APP_ACCESS_TOKEN
        generateValue: true
      - key: SKILLS_ADMIN_TOKEN
        generateValue: true
      - key: DEEPSEEK_API_BASE_URL
        value: https://api.deepseek.com
      - key: DATA_DIR
        value: /var/data
    disk:
      name: ues-agent-data
      mountPath: /var/data
      sizeGB: 1
